<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot — GradeMate!</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="Assets/GradeMate_icon-removebg-preview.png"> 

</head>
<body class="chalk-bg">
<div class="shell">
  <header class="topnav" id="topnav"></header>

  <main>
    <div class="eyebrow">Core Feature</div>
    <h1 class="page-title">Conversational Academic Support</h1>
    <p class="page-sub">Ask about grades, requirements, deadlines, or the grading system — GradeMate! answers instantly using your student record and the school's FAQ knowledge base.</p>

    <div class="chat-shell" style="margin-top:18px;">
      <div class="chat-header">
        <h2 id="chatSubject">Chat</h2>
        <div class="status"><span class="dot"></span> Online · read-only grade access</div>
      </div>
      <div class="chat-scroll" id="chatScroll"></div>
      <div class="composer">
        <input id="chatInput" type="text" placeholder="Ask about grades, requirements, deadlines…">
        <button class="btn" onclick="handleSend()">Send</button>
      </div>
    </div>

    <div class="quick-chips">
      <button onclick="sendQuick('Check my grades')">Check my grades</button>
      <button onclick="sendQuick('Enrollment requirements')">Requirements</button>
      <button onclick="sendQuick('Grading system')">Grading system</button>
      <button onclick="sendQuick('Deadlines')">Deadlines</button>
      <button onclick="sendQuick('Am I at risk?')">Am I at risk?</button>
    </div>
  </main>

  <footer class="site-footer">GradeMate! · Luciano Millan National High School</footer>
</div>

<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
