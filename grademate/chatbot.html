<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot — GradeMate!</title>
<link rel="stylesheet" href="css/style.css">
<style>
  main{ padding:24px 28px 0; display:flex; flex-direction:column; }
  .chat-shell{
    display:flex; flex-direction:column;
    background:var(--chalk-green); border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    height:calc(100vh - 190px); min-height:420px; overflow:hidden;
  }
  .chat-header{
    padding:16px 22px; border-bottom:1px dashed rgba(242,237,228,0.25);
    display:flex; align-items:center; justify-content:space-between;
  }
  .chat-header h2{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:17px; color:var(--chalk-cream); margin:0; }
  .status{ font-size:11px; color:#8FD19E; display:flex; align-items:center; gap:6px; }
  .status .dot{ width:7px; height:7px; border-radius:50%; background:#8FD19E; }

  .chat-scroll{ flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px; }
  .msg{ max-width:74%; display:flex; flex-direction:column; gap:5px; }
  .msg.bot{ align-self:flex-start; }
  .msg.user{ align-self:flex-end; align-items:flex-end; }
  .msg .who{ font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:rgba(242,237,228,0.4); }
  .bubble{ padding:12px 15px; border-radius:var(--radius); font-size:14px; line-height:1.55; }
  .msg.bot .bubble{ background:var(--manila); color:var(--ink); border-top-left-radius:0; }
  .msg.user .bubble{ background:var(--chalk-cream); color:var(--chalk-green-deep); border-top-right-radius:0; }

  .reportcard{ background:var(--chalk-cream); border:1px solid var(--manila-dark); border-radius:var(--radius); padding:14px 16px; font-family:var(--mono); position:relative; }
  .reportcard .rc-title{ font-family:var(--serif); font-size:14px; font-weight:600; margin-bottom:8px; color:var(--chalk-green-deep); }
  .reportcard table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .reportcard td{ padding:4px 2px; border-bottom:1px dotted rgba(0,0,0,0.15); }
  .reportcard td.grade{ text-align:right; font-weight:600; }
  .reportcard td.low{ color:var(--pen-red); }

  .typing{ display:flex; gap:4px; padding:4px 0; }
  .typing span{ width:5px; height:5px; border-radius:50%; background:rgba(0,0,0,0.35); animation:blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:.2;} 40%{opacity:1;} }

  .composer{ padding:14px 22px 18px; border-top:1px dashed rgba(242,237,228,0.25); display:flex; gap:10px; }
  .composer input{ flex:1; }

  .quick-chips{ display:flex; flex-wrap:wrap; gap:7px; margin:14px 0 0; }
  .quick-chips button{
    background:rgba(242,237,228,0.08); border:1px solid rgba(242,237,228,0.25); color:var(--chalk-cream);
    font-size:11.5px; padding:7px 12px; border-radius:20px; cursor:pointer; font-family:var(--sans);
  }
  .quick-chips button:hover{ background:rgba(242,237,228,0.18); }
</style>
</head>
<body class="chalk-bg">
<div class="shell">
  <header class="topnav" id="topnav"></header>

  <main>
    <div class="eyebrow">Core Feature</div>
    <h1 class="page-title">Conversational Academic Support</h1>
    <p class="page-sub">Ask about grades, requirements, deadlines, or the grading system — GradeMate! answers instantly using your student record and the school's FAQ knowledge base.</p>

    <div class="chat-shell" style="margin-top:18px;">
      <div class="chat-header">
        <h2 id="chatSubject">Chat</h2>
        <div class="status"><span class="dot"></span> Online · read-only grade access</div>
      </div>
      <div class="chat-scroll" id="chatScroll"></div>
      <div class="composer">
        <input id="chatInput" type="text" placeholder="Ask about grades, requirements, deadlines…">
        <button class="btn" onclick="handleSend()">Send</button>
      </div>
    </div>

    <div class="quick-chips">
      <button onclick="sendQuick('Check my grades')">Check my grades</button>
      <button onclick="sendQuick('Enrollment requirements')">Requirements</button>
      <button onclick="sendQuick('Grading system')">Grading system</button>
      <button onclick="sendQuick('Deadlines')">Deadlines</button>
      <button onclick="sendQuick('Am I at risk?')">Am I at risk?</button>
    </div>
  </main>

  <footer class="site-footer">GradeMate! · Luciano Millan National High School</footer>
</div>

<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
