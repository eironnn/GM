<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — GradeMate!</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="Assets/GradeMate_icon-removebg-preview.png">

</head>
<body class="chalk-bg">
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="mark">Grade<em>Mate!</em></div>
        <div class="school">Luciano Millan National High School</div>
      </div>

      <div class="role-toggle">
        <button type="button" id="roleStudentBtn" class="active" onclick="setRole('student')">Student</button>
        <button type="button" id="roleAdminBtn" onclick="setRole('admin')">Registrar Admin</button>
      </div>

      <form id="loginForm">
        <div class="field" id="studentField">
          <label for="studentSelect">I am</label>
          <select id="studentSelect"></select>
        </div>
        <div class="field">
          <label for="pw">Password</label>
          <input type="password" id="pw" placeholder="Any value works in this prototype" value="demo123">
        </div>
        <button type="submit" class="btn">Log in</button>
      </form>

      <div class="hint">Prototype login — no real credentials required.<br>Pick a name and continue.</div>
    </div>
  </div>
  <a class="back" href="index.html">← Back to landing page</a>

<script src="js/data.js"></script>
<script>
  let role = 'student';

  function populateStudents(){
    const sel = document.getElementById('studentSelect');
    sel.innerHTML = Object.entries(STUDENTS).map(([id,s]) =>
      `<option value="${id}">${s.name} — Grade ${s.grade} ${s.section}</option>`).join('');
  }

  function setRole(r){
    role = r;
    document.getElementById('roleStudentBtn').classList.toggle('active', r==='student');
    document.getElementById('roleAdminBtn').classList.toggle('active', r==='admin');
    document.getElementById('studentField').style.display = r === 'student' ? 'block' : 'none';
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    if(role === 'admin'){
      window.location.href = `reports.html?role=admin`;
    } else {
      const id = document.getElementById('studentSelect').value;
      window.location.href = `dashboard.html?id=${id}&role=student`;
    }
  });

  populateStudents();
</script>
</body>
</html>
