<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — GradeMate!</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:28px; position:relative; z-index:2;
  }
  .login-card{
    width:100%; max-width:400px;
    background:var(--manila); border-radius:var(--radius);
    padding:30px 28px; box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .login-card .brand{ text-align:center; margin-bottom:22px; }
  .login-card .brand .mark{ font-family:var(--serif); font-weight:700; font-size:26px; color:var(--chalk-green-deep); }
  .login-card .brand .mark em{ color:var(--pen-red); font-style:italic; }
  .login-card .brand .school{ font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#6b5a37; margin-top:2px; }

  .role-toggle{ display:flex; gap:6px; margin-bottom:18px; }
  .role-toggle button{
    flex:1; padding:9px; border-radius:var(--radius); cursor:pointer;
    border:1px solid var(--manila-dark); background:transparent;
    font-family:var(--sans); font-size:12.5px; font-weight:600; color:#54462B;
  }
  .role-toggle button.active{ background:var(--chalk-green-deep); color:var(--chalk-cream); border-color:var(--chalk-green-deep); }

  .login-card label{ color:#6b5a37; }
  .login-card select, .login-card input{
    background:#fff; color:var(--ink); border:1px solid var(--manila-dark);
  }
  .login-card .btn{ width:100%; margin-top:6px; }
  .hint{ font-size:11px; color:#6b5a37; margin-top:14px; text-align:center; line-height:1.5; }
  .back{ display:block; text-align:center; margin-top:16px; font-size:12px; color:rgba(242,237,228,0.55); }
</style>
</head>
<body class="chalk-bg">
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="mark">Grade<em>Mate!</em></div>
        <div class="school">Luciano Millan National High School</div>
      </div>

      <div class="role-toggle">
        <button type="button" id="roleStudentBtn" class="active" onclick="setRole('student')">Student</button>
        <button type="button" id="roleAdminBtn" onclick="setRole('admin')">Registrar Admin</button>
      </div>

      <form id="loginForm">
        <div class="field" id="studentField">
          <label for="studentSelect">I am</label>
          <select id="studentSelect"></select>
        </div>
        <div class="field">
          <label for="pw">Password</label>
          <input type="password" id="pw" placeholder="Any value works in this prototype" value="demo123">
        </div>
        <button type="submit" class="btn">Log in</button>
      </form>

      <div class="hint">Prototype login — no real credentials required.<br>Pick a name and continue.</div>
    </div>
  </div>
  <a class="back" href="index.html">← Back to landing page</a>

<script src="js/data.js"></script>
<script>
  let role = 'student';

  function populateStudents(){
    const sel = document.getElementById('studentSelect');
    sel.innerHTML = Object.entries(STUDENTS).map(([id,s]) =>
      `<option value="${id}">${s.name} — Grade ${s.grade} ${s.section}</option>`).join('');
  }

  function setRole(r){
    role = r;
    document.getElementById('roleStudentBtn').classList.toggle('active', r==='student');
    document.getElementById('roleAdminBtn').classList.toggle('active', r==='admin');
    document.getElementById('studentField').style.display = r === 'student' ? 'block' : 'none';
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    if(role === 'admin'){
      window.location.href = `reports.html?role=admin`;
    } else {
      const id = document.getElementById('studentSelect').value;
      window.location.href = `dashboard.html?id=${id}&role=student`;
    }
  });

  populateStudents();
</script>
</body>
</html>
